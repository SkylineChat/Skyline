<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Socket.io Client Library -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="background-decor blob-1"></div>
    <div class="background-decor blob-2"></div>

    <div class="app-container">
        <!-- 1. USERNAME SCREEN -->
        <div id="username-screen" class="glass-panel active-screen">
            <h1 class="logo">Skyline</h1>
            <p class="subtitle">Enter a temporary username to enter the skyline.</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Type your username..." maxlength="15" autocomplete="off">
                <button id="enter-btn">Join Chat</button>
            </div>
            <p id="username-error" class="error-msg"></p>
        </div>

        <!-- 2. HOME SCREEN -->
        <div id="home-screen" class="glass-panel hidden">
            <header class="home-header">
                <h1 class="logo-sm">Skyline</h1>
                <div class="user-badge">
                    <span class="pulse-indicator"></span>
                    <span id="display-username">Username</span>
                </div>
            </header>

            <!-- Game-like Menu Hub -->
            <div id="main-menu" class="menu-container">
                <button id="menu-public-btn" class="menu-opt-btn">
                    <span class="btn-icon">🌐</span>
                    <div class="btn-text">
                        <span class="btn-title">Browse Public Chats</span>
                        <span class="btn-sub">See active chats you can join right away</span>
                    </div>
                </button>

                <button id="menu-create-btn" class="menu-opt-btn">
                    <span class="btn-icon">➕</span>
                    <div class="btn-text">
                        <span class="btn-title">Host a Chat Room</span>
                        <span class="btn-sub">Create your own public or private space</span>
                    </div>
                </button>

                <button id="menu-join-btn" class="menu-opt-btn">
                    <span class="btn-icon">🔑</span>
                    <div class="btn-text">
                        <span class="btn-title">Join Private Chat</span>
                        <span class="btn-sub">Enter a 5-character code to join a private chat</span>
                    </div>
                </button>

                <button id="menu-ai-btn" class="menu-opt-btn highlight-btn">
                    <span class="btn-icon">🤖</span>
                    <div class="btn-text">
                        <span class="btn-title">AI Assistant</span>
                        <span class="btn-sub">Chat locally & privately with a powerful AI model</span>
                    </div>
                </button>
            </div>

            <!-- Option 1 View: Public Chats Panel -->
            <div id="public-chats-panel" class="sub-panel hidden">
                <div class="sub-panel-header">
                    <button class="back-btn">← Back</button>
                    <h3>Public Chats</h3>
                </div>
                <div id="public-rooms-list" class="rooms-container">
                    <p class="empty-state">No public chats available. Create one!</p>
                </div>
            </div>

            <!-- Option 2 View: Create a Chat Panel -->
            <div id="create-chat-panel" class="sub-panel hidden">
                <div class="sub-panel-header">
                    <button class="back-btn">← Back</button>
                    <h3>Host a Chat Room</h3>
                </div>
                <div class="form-group">
                    <input type="text" id="new-room-name" placeholder="Chat Room Name" maxlength="20" autocomplete="off">
                    
                    <div class="toggle-group">
                        <label>Room Type:</label>
                        <div class="radio-options">
                            <label><input type="radio" name="room-privacy" value="public" checked> Public</label>
                            <label><input type="radio" name="room-privacy" value="private"> Private</label>
                        </div>
                    </div>

                    <div class="range-group">
                        <label for="max-users">Max Users: <span id="max-users-val">10</span></label>
                        <input type="range" id="max-users" min="2" max="50" value="10">
                    </div>

                    <button id="create-room-btn" class="action-btn">Create & Join</button>
                    <p id="create-error" class="error-msg"></p>
                </div>
            </div>

            <!-- Option 3 View: Join Private Chat Panel -->
            <div id="join-private-panel" class="sub-panel hidden">
                <div class="sub-panel-header">
                    <button class="back-btn">← Back</button>
                    <h3>Join via Room Code</h3>
                </div>
                <div class="form-group">
                    <input type="text" id="join-code-input" placeholder="e.g. X8J2K" maxlength="5" autocomplete="off">
                    <button id="join-room-btn" class="action-btn secondary">Enter Chat</button>
                    <p id="join-error" class="error-msg"></p>
                </div>
            </div>

            <!-- NEW: Split AI Chat Panel (Sidebar + Main Window) -->
            <div id="ai-chats-panel" class="sub-panel hidden">
                <div class="ai-studio-layout">
                    <!-- AI Sidebar (Left) -->
                    <aside class="ai-sidebar">
                        <button class="back-btn sidebar-back-btn">← Menu</button>
                        <button id="new-ai-chat-btn" class="new-chat-btn">+ New Chat</button>
                        <div id="ai-conversations-list" class="ai-conversations-list">
                            <!-- Previous chats rendered here -->
                        </div>
                    </aside>

                    <!-- AI Chat Window (Right) -->
                    <main class="ai-chat-main">
                        <header class="ai-chat-header">
                            <h3 id="ai-current-chat-title">New Conversation</h3>
                            <button id="delete-current-chat-btn" class="clear-btn">Delete Chat</button>
                        </header>
                        
                        <div id="ai-messages-display" class="chat-messages ai-chat-box">
                            <!-- Chat messages populate here -->
                        </div>

                        <div class="chat-input-area">
                            <input type="text" id="ai-message-input" placeholder="Ask AI anything..." autocomplete="off">
                            <button id="ai-send-btn">Send</button>
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- 3. CHAT ROOM SCREEN -->
        <div id="chat-screen" class="glass-panel hidden">
            <header class="chat-header">
                <div class="chat-meta">
                    <h2 id="chat-title">Room Name</h2>
                    <div class="code-badge">
                        <span>Code: <strong id="chat-code-display">-----</strong></span>
                        <button id="copy-code-btn" title="Copy Room Code">Copy</button>
                    </div>
                </div>
                <button id="leave-chat-btn" class="leave-btn">Leave</button>
            </header>

            <div id="messages-display" class="chat-messages">
                <!-- Messages populate here -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-message-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
